name: PlanBridgeAI
options:
  bundleIdPrefix: com.planbridge
  deploymentTarget:
    iOS: '17.0'
packages:
  PlanBridgeCore:
    path: .
settings:
  base:
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGN_STYLE: Automatic
targets:
  PlanBridgeAI:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Info.plist]
    dependencies:
      - package: PlanBridgeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.PlanBridgeAI.app
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    scheme:
      gatherCoverageData: true
      testTargets:
        - PlanBridgeUITests
  PlanBridgeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: PlanBridgeAI
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.PlanBridgeAI.app.uitests
