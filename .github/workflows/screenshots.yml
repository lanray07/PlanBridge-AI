name: Capture native store screenshots
on:
  workflow_dispatch:
    inputs:
      language:
        description: Language to capture (non-English uses draft translations for QA only)
        type: choice
        options: [English, French, Spanish, German]
        default: English
permissions:
  contents: read
jobs:
  capture:
    runs-on: macos-15
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: iPhone 16 Pro Max
            label: iphone-69
          - device: iPad Pro 13-inch (M4)
            label: ipad-13
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'
      - run: brew install xcodegen
      - run: bash scripts/prepare-mac.sh
      - name: Prepare translation preview
        if: inputs.language != 'English'
        run: python3 scripts/prepare-localizations.py localization/source/Localizable.xcstrings --preview-output App/Resources/Localizable.xcstrings
      - name: Capture actual keyword screens
        env:
          SCREENSHOT_DEVICE: ${{ matrix.device }}
          SCREENSHOT_LANGUAGE: ${{ inputs.language }}
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,os,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k in sorted(d,reverse=True) if "iOS" in k for x in d[k] if x["name"] == os.environ["SCREENSHOT_DEVICE"]))')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override --time '9:41' --batteryState charged --batteryLevel 100
          xcodebuild -project PlanBridgeAI.xcodeproj -scheme PlanBridgeAI -destination "platform=iOS Simulator,id=$DEVICE" -parallel-testing-enabled NO "-only-testing:PlanBridgeUITests/MarketingScreenshotTests/test${SCREENSHOT_LANGUAGE}KeywordScreenshots" -resultBundlePath Screenshots.xcresult CODE_SIGN_IDENTITY="-" CODE_SIGNING_ALLOWED=YES test
      - name: Export native PNG attachments
        if: always()
        run: |
          if [ -d Screenshots.xcresult ]; then
            xcrun xcresulttool export attachments --path Screenshots.xcresult --output-path artifacts
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-screenshots-${{ matrix.label }}-${{ inputs.language }}
          path: artifacts
          if-no-files-found: warn
