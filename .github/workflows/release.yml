name: Xcode build and upload
on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload signed archive to App Store Connect
        type: boolean
        default: false
      capture:
        description: Run simulator screenshot test
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  xcode:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: brew install xcodegen
      - run: bash scripts/prepare-mac.sh
      - name: Test core
        run: swift test
      - name: Build and capture actual subscription screen
        if: inputs.capture
        shell: bash
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for k,v in d["devices"].items() if "iOS" in k for x in v if "iPhone" in x["name"]))')
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcodebuild -project PlanBridgeAI.xcodeproj -scheme PlanBridgeAI -destination "platform=iOS Simulator,id=$DEVICE" -resultBundlePath Results.xcresult CODE_SIGNING_ALLOWED=NO test
      - name: Export screenshot attachments
        if: always()
        run: |
          mkdir -p artifacts
          if [ -d Results.xcresult ]; then
            xcrun xcresulttool export attachments --path Results.xcresult --output-path artifacts
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: subscription-screenshots
          path: artifacts
          if-no-files-found: warn
      - name: Archive and upload using App Store Connect API key
        if: inputs.upload
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$ASC_PRIVATE_KEY" > "$KEY_PATH"
          trap 'rm -f "$KEY_PATH"' EXIT
          xcodebuild -project PlanBridgeAI.xcodeproj -scheme PlanBridgeAI -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/PlanBridge.xcarchive" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_IDENTITY='Apple Distribution' CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" -allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" archive
          python3 - <<'PY'
          import os, plistlib
          with open(os.environ['RUNNER_TEMP']+'/ExportOptions.plist','wb') as f:
              plistlib.dump({'method':'app-store-connect','destination':'upload','teamID':os.environ['APPLE_TEAM_ID'],'signingStyle':'automatic','manageAppVersionAndBuildNumber':False},f)
          PY
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/PlanBridge.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" -allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
