name: Verify PlanBridge
on: [push, pull_request, workflow_dispatch]
jobs:
  core-and-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install project generator
        run: brew install xcodegen
      - name: Test deterministic core
        run: swift test
      - name: Validate store copy
        run: python3 scripts/validate-store-metadata.py
      - name: Generate app project
        run: bash scripts/prepare-mac.sh
      - name: Build iOS simulator app
        run: xcodebuild -project PlanBridgeAI.xcodeproj -scheme PlanBridgeAI -destination 'generic/platform=iOS Simulator' -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Export public interface strings for translation
        run: xcodebuild -exportLocalizations -project PlanBridgeAI.xcodeproj -localizationPath LocalizationExport -exportLanguage en CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        with:
          name: localization-source
          path: LocalizationExport
